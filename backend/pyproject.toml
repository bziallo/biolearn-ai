[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "biolearn-api"
version = "0.1.0"
description = "BioLearn AI backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "argon2-cffi>=25.0,<26.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "python-pptx>=1.0,<2.0",
    "sqlalchemy>=2.0.36,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.14,<3.0",
    "pytest>=8.3,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
